name: Build SCF Chrome Layer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) 在 ubuntu 上装纯 Python 依赖（selenium 跨版本通用）
      - name: Install python deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "selenium==4.9.1" "urllib3<2" "trio<0.23" -t layer_root
          find layer_root -name "__pycache__" -type d -prune -exec rm -rf {} +

      # 2) 在 CentOS 7 容器里取 EPEL 的 chromium（专为 CentOS7/glibc2.17 构建）+ 收集所有 .so
      #    CentOS 7 官方源已停服，需切换到 vault.centos.org 归档源
      - name: Build chrome + libs on CentOS 7
        run: |
          docker run --rm -v "$PWD/layer_root:/layer" centos:7 bash -c '
            set -x
            # 切换到 CentOS 7 Vault 归档源
            sed -i "s|^mirrorlist=|#mirrorlist=|g; s|^#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g" /etc/yum.repos.d/CentOS-Base.repo
            yum install -y epel-release
            # EPEL 7 也已归档
            sed -i "s|^metalink=|#metalink=|g; s|^#baseurl=https\?://download.fedoraproject.org/pub/epel/|baseurl=https://archives.fedoraproject.org/pub/archive/epel/|g" /etc/yum.repos.d/epel.repo
            yum install -y chromium chromedriver
            mkdir -p /layer/chrome/lib
            # 用真正的二进制（/usr/bin/chromium-browser 只是包装脚本）
            CHROME_SRC=$(find /usr/lib64/chromium-browser /usr/libexec/chromium-browser -maxdepth 1 -type f -name "chromium-browser" 2>/dev/null | head -1)
            [ -z "$CHROME_SRC" ] && CHROME_SRC=$(readlink -f /usr/bin/chromium-browser 2>/dev/null)
            DRIVER_SRC=$(command -v chromedriver || find / -name "chromedriver" -type f 2>/dev/null | head -1)
            echo "CHROME_SRC=$CHROME_SRC"; echo "DRIVER_SRC=$DRIVER_SRC"
            ls -l "$CHROME_SRC" "$DRIVER_SRC"
            cp -L "$CHROME_SRC" /layer/chrome/chrome
            cp -L "$DRIVER_SRC" /layer/chrome/chromedriver
            chmod +x /layer/chrome/chrome /layer/chrome/chromedriver
            echo "=== full ldd of chrome ==="
            ldd /layer/chrome/chrome || true
            ldd /layer/chrome/chromedriver || true
            ldd /layer/chrome/chrome /layer/chrome/chromedriver 2>/dev/null \
              | grep -E "=>" | awk "{print \$1, \$3}" | while read soname resolved; do
                [ -z "$resolved" ] && continue
                [ ! -e "$resolved" ] && continue
                base=$(basename "$resolved")
                cp -L "$resolved" "/layer/chrome/lib/$base" 2>/dev/null || true
                linkname=$(basename "$soname")
                [ "$linkname" != "$base" ] && ln -sf "$base" "/layer/chrome/lib/$linkname" 2>/dev/null || true
              done
            # 构建时统一加执行权限（层 /opt 只读，必须在打包前搞定；此处为 root 可执行）
            chmod +x /layer/chrome/chrome /layer/chrome/chromedriver
            find /layer -name "selenium-manager" -exec chmod +x {} +
            echo "collected libs count:"; ls /layer/chrome/lib | wc -l
            ls /layer/chrome/lib | head
          '

      # 3) 打包
      - name: Zip layer
        run: |
          cd layer_root
          zip -r ../scf-chrome-layer.zip .
          cd ..
          ls -lh scf-chrome-layer.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scf-chrome-layer
          path: scf-chrome-layer.zip
